<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc"><title id="title">Farm safety roles and authority concept map</title><desc id="desc">A course-owned diagram linking Safety is shared, but authority is not equal, Know what is expected before work begins, Take reasonable care through observable actions, Consulting others improves the picture.</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 z" fill="#185d49"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#102e25" flood-opacity=".16"/></filter></defs><rect width="900" height="600" rx="28" fill="#fbfaf5"/><rect x="0" y="0" width="900" height="132" rx="28" fill="#143f34"/><rect x="0" y="106" width="900" height="26" fill="#143f34"/><text x="54" y="42" font-family="Arial, Segoe UI, sans-serif" font-size="25" font-weight="900" letter-spacing="2" fill="#f0bf43">TASK 01 · TASK-01-01</text><text x="54" y="74" text-anchor="start" font-family="Arial, Segoe UI, sans-serif" font-size="34" font-weight="800" fill="#fff"><tspan x="54" dy="0">Farm safety roles and</tspan><tspan x="54" dy="36">authority</tspan></text><path d="M 217 320 L 238 320" fill="none" stroke="#185d49" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 442 320 L 463 320" fill="none" stroke="#185d49" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 667 320 L 688 320" fill="none" stroke="#185d49" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="5" y="205" width="220" height="230" rx="24" fill="#e8f3ee" stroke="#185d49" stroke-width="5"/><text x="115" y="287.25" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="25" font-weight="800" fill="#14352b"><tspan x="115" dy="0">Safety is</tspan><tspan x="115" dy="29">shared, but</tspan><tspan x="115" dy="29">authority is</tspan><tspan x="115" dy="29">not equal</tspan></text></g><g filter="url(#shadow)"><rect x="230" y="205" width="220" height="230" rx="24" fill="#fff4d7" stroke="#b77a12" stroke-width="5"/><text x="340" y="287.25" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="25" font-weight="800" fill="#14352b"><tspan x="340" dy="0">Know what</tspan><tspan x="340" dy="29">is expected</tspan><tspan x="340" dy="29">before</tspan><tspan x="340" dy="29">work begins</tspan></text></g><g filter="url(#shadow)"><rect x="455" y="205" width="220" height="230" rx="24" fill="#e8f2f7" stroke="#2a6f91" stroke-width="5"/><text x="565" y="258.25" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="25" font-weight="800" fill="#14352b"><tspan x="565" dy="0">Take</tspan><tspan x="565" dy="29">reasonable</tspan><tspan x="565" dy="29">care</tspan><tspan x="565" dy="29">through</tspan><tspan x="565" dy="29">observable</tspan><tspan x="565" dy="29">actions</tspan></text></g><g filter="url(#shadow)"><rect x="680" y="205" width="220" height="230" rx="24" fill="#f1eaf7" stroke="#805c9f" stroke-width="5"/><text x="790" y="287.25" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="25" font-weight="800" fill="#14352b"><tspan x="790" dy="0">Consulting</tspan><tspan x="790" dy="29">others</tspan><tspan x="790" dy="29">improves</tspan><tspan x="790" dy="29">the picture</tspan></text></g><rect x="45" y="560" width="810" height="4" rx="2" fill="#d7e6de"/><text x="450" y="588" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="25" font-weight="700" fill="#35574d">Observe · compare · confirm the current authorised source</text></svg>