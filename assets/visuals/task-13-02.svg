<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc"><title id="title">Hazards, isolation authority and exclusion concept map</title><desc id="desc">A course-owned diagram linking Multiple hazard domains, Isolation is an authorised state, not a learner assumption, Exclusion protects people from unresolved exposure, Visible damage is evidence, not permission to investigate.</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 z" fill="#185d49"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#102e25" flood-opacity=".16"/></filter></defs><rect width="900" height="600" rx="28" fill="#fbfaf5"/><rect x="0" y="0" width="900" height="132" rx="28" fill="#143f34"/><rect x="0" y="106" width="900" height="26" fill="#143f34"/><text x="54" y="42" font-family="Arial, Segoe UI, sans-serif" font-size="25" font-weight="900" letter-spacing="2" fill="#f0bf43">TASK 13 · TASK-13-02</text><text x="54" y="74" text-anchor="start" font-family="Arial, Segoe UI, sans-serif" font-size="34" font-weight="800" fill="#fff"><tspan x="54" dy="0">Hazards, isolation authority</tspan><tspan x="54" dy="36">and exclusion</tspan></text><path d="M 305 240 C 333 240, 272 330, 300 330" fill="none" stroke="#185d49" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 595 240 C 623 240, 572 330, 600 330" fill="none" stroke="#185d49" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 450 420 L 450 415" fill="none" stroke="#185d49" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="280" y="285" width="340" height="130" rx="24" fill="#e8f3ee" stroke="#185d49" stroke-width="5"/><text x="450" y="346.18" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="26" font-weight="800" fill="#14352b"><tspan x="450" dy="0">Multiple hazard</tspan><tspan x="450" dy="30">domains</tspan></text></g><g filter="url(#shadow)"><rect x="20" y="160" width="300" height="155" rx="24" fill="#fff4d7" stroke="#b77a12" stroke-width="5"/><text x="170" y="204.75" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="25" font-weight="800" fill="#14352b"><tspan x="170" dy="0">Isolation is an</tspan><tspan x="170" dy="29">authorised state,</tspan><tspan x="170" dy="29">not a learner</tspan><tspan x="170" dy="29">assumption</tspan></text></g><g filter="url(#shadow)"><rect x="580" y="160" width="300" height="155" rx="24" fill="#e8f2f7" stroke="#2a6f91" stroke-width="5"/><text x="730" y="204.75" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="25" font-weight="800" fill="#14352b"><tspan x="730" dy="0">Exclusion</tspan><tspan x="730" dy="29">protects people</tspan><tspan x="730" dy="29">from unresolved</tspan><tspan x="730" dy="29">exposure</tspan></text></g><g filter="url(#shadow)"><rect x="250" y="420" width="400" height="130" rx="24" fill="#f1eaf7" stroke="#805c9f" stroke-width="5"/><text x="450" y="466.75" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="25" font-weight="800" fill="#14352b"><tspan x="450" dy="0">Visible damage is</tspan><tspan x="450" dy="29">evidence, not permission</tspan><tspan x="450" dy="29">to investigate</tspan></text></g><rect x="45" y="560" width="810" height="4" rx="2" fill="#d7e6de"/><text x="450" y="588" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="25" font-weight="700" fill="#35574d">Observe · compare · confirm the current authorised source</text></svg>