ddle" font-family="Arial, Segoe UI, sans-serif" font-size="25" font-weight="800" fill="#14352b"><tspan x="137.5" dy="0">Record what</tspan><tspan x="137.5" dy="29">the source</tspan><tspan x="137.5" dy="29">supports</tspan></text></g><g filter="url(#shadow)"><rect x="630" y="370" width="265" height="180" rx="24" fill="#e8f2f7" stroke="#2a6f91" stroke-width="5"/><text x="762.5" y="427.25" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="25" font-weight="800" fill="#14352b"><tspan x="762.5" dy="0">Handover</tspan><tspan x="762.5" dy="29">includes</tspan><tspan x="762.5" dy="29">status, not</tspan><tspan x="762.5" dy="29">just history</tspan></text></g><g filter="url(#shadow)"><rect x="270" y="300" width="360" height="155" rx="24" fill="#f1eaf7" stroke="#805c9f" stroke-width="5"/><text x="450" y="373.75" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="25" font-weight="800" fill="#14352b"><tspan x="450" dy="0">Reconcile linked</tspan><tspan x="450" dy="29">records</tspan></text></g><rect x="45" y="560" width="810" height="4" rx="2" fill="#d7e6de"/><text x="450" y="588" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="25" font-weight="700" fill="#35574d">Observe · compare · confirm the current authorised source</text></svg>